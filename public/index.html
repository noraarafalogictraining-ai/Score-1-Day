<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="NextWave | SCORE Performance Hub: performance management training simulation by LOGIC.">
</head>
<body>
<title>NextWave | SCORE Performance Hub · Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;600;700;800&display=swap">
<style>
/* SCORE Performance Hub — enterprise workspace: SCORE navy chrome, light working surface. */
:root {
  color-scheme: light;
  --navy: #0A1630; --navy2: #12234A; --navy3: #1B3264;
  --blue: #1F5FD6; --blue-d: #1849A8; --blue-soft: #E8F0FF; --blue-line: #BCD0F7;
  --cyan: #18A7BC; --cyan-soft: #E3F6F8;
  --purple: #6B5BD6; --purple-soft: #EFEDFD;
  --bg: #F3F5F9; --surface: #FFFFFF; --surface2: #F8F9FC; --line: #E1E6EF; --line2: #CBD3E1;
  --text: #17223A; --text2: #42506A; --muted: #6A778F;
  --good: #1E8A5A; --good-soft: #E4F5EC; --warn: #A86A00; --warn-soft: #FFF3D9; --risk: #C2402F; --risk-soft: #FDECE9;
  --ph: #8A5A00; --ph-soft: #FFF7E0; --ph-line: #F0D27A;
  --shadow: 0 1px 2px rgba(16,30,60,.06), 0 4px 14px rgba(16,30,60,.06);
  --shadow-lg: 0 18px 50px rgba(10,22,48,.25);
  --f-display: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px; --r-sm: 7px;
  --side: 248px; --head: 56px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: var(--f-body); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; letter-spacing: -0.01em; line-height: 1.2; color: var(--text); }
h1 { font-size: 1.55rem; font-weight: 700; } h2 { font-size: 1.2rem; font-weight: 700; } h3 { font-size: 1.02rem; font-weight: 650; } h4 { font-size: .92rem; font-weight: 650; }
p { margin: 0; }
a { color: var(--blue); }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--text); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.muted { color: var(--muted); } .t2 { color: var(--text2); } .small { font-size: .86rem; } .xs { font-size: .76rem; } .num { font-variant-numeric: tabular-nums; }
.b { font-weight: 650; }
.stack { display: flex; flex-direction: column; gap: 14px; } .stack-sm { display: flex; flex-direction: column; gap: 6px; } .stack-lg { display: flex; flex-direction: column; gap: 22px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .between { justify-content: space-between; } .nowrap { flex-wrap: nowrap; } .grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
.eyebrow { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 650; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.i { width: 18px; height: 18px; flex: none; }
svg.i-sm { width: 15px; height: 15px; flex: none; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: var(--r-sm); border: 1px solid var(--line2); background: var(--surface); font-weight: 600; font-size: .88rem; color: var(--text); white-space: nowrap; }
.btn:hover { border-color: var(--blue-line); background: var(--surface2); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover { background: var(--blue-d); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--blue); padding-inline: 8px; }
.btn.ghost:hover { background: var(--blue-soft); }
.btn.danger { color: var(--risk); }
.btn.sm { padding: 5px 10px; font-size: .8rem; }
.btn[disabled], .btn.disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); position: relative; }
.icon-btn:hover { background: var(--blue-soft); color: var(--blue); }

/* ---------- chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: .74rem; font-weight: 650; border: 1px solid transparent; white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .85; }
.chip.plain::before { display: none; }
.st-not_started { background: #EEF1F6; color: #5A6680; }
.st-draft { background: var(--warn-soft); color: var(--warn); }
.st-pending_alignment, .st-submitted { background: var(--purple-soft); color: var(--purple); }
.st-approved, .st-completed { background: var(--good-soft); color: var(--good); }
.st-in_progress { background: var(--blue-soft); color: var(--blue); }
.st-action { background: var(--risk-soft); color: var(--risk); }
.st-locked { background: #EEF1F6; color: #8592A8; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 5px; font-size: .72rem; font-weight: 600; background: #EEF1F6; color: var(--text2); white-space: nowrap; }
.tag.blue { background: var(--blue-soft); color: var(--blue); } .tag.cyan { background: var(--cyan-soft); color: #0E7686; } .tag.purple { background: var(--purple-soft); color: var(--purple); }
.round-tag { font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
.ph { display: block; background: var(--ph-soft); border: 1px dashed var(--ph-line); color: var(--ph); border-radius: 7px; padding: 8px 11px; font-size: .84rem; }
.ph b { font-weight: 700; letter-spacing: .02em; }
.ph-inline { background: var(--ph-soft); color: var(--ph); border: 1px dashed var(--ph-line); border-radius: 5px; padding: 0 6px; font-size: .74rem; font-weight: 650; white-space: nowrap; }

/* ---------- login (follows the original SCORE artifact design) ---------- */
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 18px;
  background: radial-gradient(1200px 600px at 85% -10%, rgba(154,140,242,.16), transparent 60%), radial-gradient(900px 520px at -10% 10%, rgba(73,207,224,.12), transparent 60%), radial-gradient(700px 500px at 50% 120%, rgba(73,207,224,.08), transparent 60%), #0A1224; }
.login-card { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 22px; padding: 38px 34px 32px; border-radius: 18px; background: rgba(18,30,56,.82); border: 1px solid rgba(150,180,230,.16); box-shadow: 0 30px 80px rgba(2,6,18,.55); backdrop-filter: blur(10px); }
.login-logo { height: 62px; width: auto; align-self: center; margin: -6px 0 2px; }
.login-card h1 { color: #E9EEF7; text-align: center; font-size: 1.55rem; font-weight: 700; }
.login-card .field > label { color: #B9C5DA; }
.login-card .inp { background: #0E182E; border-color: rgba(150,180,230,.24); color: #E9EEF7; padding: 11px 13px; font-size: .95rem; }
.login-card .inp:focus { border-color: #49CFE0; box-shadow: 0 0 0 3px rgba(73,207,224,.18); }
.login-card .err-text { color: #F29C94; }
.login-card .btn.login-btn { background: #49CFE0; border-color: #49CFE0; color: #06202A; padding: 11px 14px; font-size: .95rem; margin-top: 4px; }
.login-card .btn.login-btn:hover { background: #6BDAE8; border-color: #6BDAE8; }
.resume-link { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid rgba(150,180,230,.16); background: rgba(14,24,46,.7); color: #B9C5DA; }
.resume-link:hover { border-color: rgba(73,207,224,.42); color: #E9EEF7; }
.resume-link b { display: block; color: #E9EEF7; font-size: .88rem; } .resume-link .xs { color: #8494B2; }
.resume-link .initials { background: #1F3155; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .lbl { font-size: .78rem; font-weight: 650; color: var(--text2); }
.lbl .req { color: var(--risk); }
.inp, .sel, .ta { width: 100%; padding: 8px 11px; border: 1px solid var(--line2); border-radius: var(--r-sm); background: #fff; font-size: .9rem; }
.ta { resize: vertical; min-height: 70px; line-height: 1.45; }
.inp:focus, .sel:focus, .ta:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(31,95,214,.15); }
.inp.err, .sel.err, .ta.err { border-color: var(--risk); background: #FFFBFA; }
.inp[readonly], .ta[readonly] { background: var(--surface2); }
.masked { -webkit-text-security: disc; }
.hint { font-size: .76rem; color: var(--muted); }
.err-text { font-size: .76rem; color: var(--risk); font-weight: 600; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 13px; border-radius: 8px; background: var(--blue-soft); color: #1C3D7A; font-size: .85rem; border: 1px solid var(--blue-line); }
.notice.warn { background: var(--warn-soft); color: #7A4E00; border-color: #F1D79A; }
.notice.risk { background: var(--risk-soft); color: #8F2C20; border-color: #F4C6BF; }
.notice.good { background: var(--good-soft); color: #145C3D; border-color: #B8E2CB; }
.notice svg { margin-top: 1px; }

/* ---------- shell ---------- */
.head { position: sticky; top: 0; z-index: 50; height: var(--head); background: var(--navy); color: #fff; display: flex; align-items: center; gap: 14px; padding: 0 16px; }
.head .logo { height: 24px; width: auto; display: block; }
.head .sep { width: 1px; height: 24px; background: rgba(255,255,255,.18); }
.head .app { font-family: var(--f-display); font-weight: 650; font-size: .98rem; letter-spacing: .01em; white-space: nowrap; }
.head .cycle { font-size: .78rem; color: #B9C6E0; padding: 4px 10px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; white-space: nowrap; }
.head .icon-btn { color: #C9D4EA; } .head .icon-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
.badge { position: absolute; top: 3px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: #E5484D; color: #fff; font-size: .64rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.user-btn { display: flex; align-items: center; gap: 8px; background: transparent; border: 0; color: #fff; padding: 4px 6px; border-radius: 8px; }
.user-btn:hover { background: rgba(255,255,255,.1); }
.initials { width: 30px; height: 30px; border-radius: 50%; background: var(--navy3); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: .78rem; border: 1px solid rgba(255,255,255,.25); }
.menu-btn { display: none; }
.dropdown { position: absolute; top: calc(100% + 6px); right: 0; background: #fff; color: var(--text); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); min-width: 240px; z-index: 80; padding: 6px; }
.dropdown.wide { width: 360px; max-width: calc(100vw - 24px); }
.dd-item { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; padding: 9px 10px; border-radius: 7px; background: none; border: 0; font-size: .86rem; color: var(--text); }
.dd-item:hover { background: var(--surface2); }
.dd-item.unread { background: var(--blue-soft); }
.dd-head { padding: 8px 10px 6px; font-size: .74rem; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: calc(100vh - var(--head)); }
.side { background: #fff; border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: var(--head); height: calc(100vh - var(--head)); overflow-y: auto; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--text2); text-decoration: none; font-size: .88rem; font-weight: 550; border: 0; background: none; width: 100%; text-align: left; }
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.on { background: var(--blue-soft); color: var(--blue); font-weight: 650; }
.nav-item .cnt { margin-left: auto; font-size: .7rem; font-weight: 700; background: #E5484D; color: #fff; border-radius: 999px; padding: 0 6px; min-width: 18px; text-align: center; }
.nav-item .lock { margin-left: auto; color: #A3AEC2; }
.side-h { padding: 0 10px; }
.team { display: flex; flex-direction: column; gap: 2px; }
.team-item { display: flex; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 8px; border: 1px solid transparent; background: none; width: 100%; text-align: left; }
.team-item:hover { background: var(--surface2); }
.team-item.on { border-color: var(--blue-line); background: var(--blue-soft); }
.team-item .nm { font-weight: 650; font-size: .86rem; } .team-item .rl { font-size: .74rem; color: var(--muted); }
.av { width: 34px; height: 34px; border-radius: 50%; background-color: #DCE3EF; background-size: cover; background-position: center 20%; flex: none; border: 1px solid var(--line); }
.av.lg { width: 56px; height: 56px; } .av.xl { width: 72px; height: 72px; } .av.sm { width: 28px; height: 28px; }
.main { padding: 22px 28px 70px; min-width: 0; max-width: 1280px; width: 100%; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.crumb { font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
.side-foot { margin-top: auto; padding: 10px; border-top: 1px solid var(--line); font-size: .74rem; color: var(--muted); }
.scrim-side { display: none; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.card.pad { padding: 16px 18px; } .card.pad-lg { padding: 20px 22px; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 13px 18px; border-bottom: 1px solid var(--line); }
.card-b { padding: 16px 18px; }
.tile { display: flex; flex-direction: column; gap: 10px; padding: 16px; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); width: 100%; min-height: 150px; }
.tile:hover { border-color: var(--blue-line); }
.tile.locked { background: var(--surface2); }
.tile .ti { width: 36px; height: 36px; border-radius: 9px; background: var(--blue-soft); color: var(--blue); display: flex; align-items: center; justify-content: center; }
.tile.locked .ti { background: #EEF1F6; color: #8592A8; }
.tile .meta { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.emp-hero { display: flex; gap: 16px; align-items: center; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: .86rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.list-plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.action-row { display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; }
.action-row:first-child { border-top: 0; }
.action-row:hover { background: var(--surface2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); flex: none; }
.dot.risk { background: var(--risk); } .dot.muted { background: #B6C0D1; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { padding: 10px 14px; border: 0; background: none; font-weight: 600; font-size: .88rem; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 7px; align-items: center; }
.tab:hover { color: var(--text); }
.tab.on { color: var(--blue); border-bottom-color: var(--blue); }
.tab .n { font-size: .72rem; background: #EEF1F6; color: var(--text2); border-radius: 999px; padding: 0 7px; }
.tab.on .n { background: var(--blue-soft); color: var(--blue); }

/* ---------- goal plan ---------- */
.plan-head { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.summary-bar { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; padding: 12px 16px; background: var(--surface2); border: 1px solid var(--line); border-radius: var(--r); }
.sb-item { display: flex; flex-direction: column; gap: 2px; } .sb-item b { font-size: 1.05rem; font-family: var(--f-display); }
.meter { height: 6px; border-radius: 999px; background: #E6EAF2; overflow: hidden; width: 160px; }
.meter i { display: block; height: 100%; background: var(--blue); border-radius: inherit; }
.meter.ok i { background: var(--good); } .meter.over i { background: var(--risk); }
.goal { border: 1px solid var(--line); border-radius: var(--r); background: #fff; box-shadow: var(--shadow); }
.goal.editing { border-color: var(--blue-line); box-shadow: 0 0 0 3px rgba(31,95,214,.08), var(--shadow); }
.goal.incomplete { border-left: 3px solid var(--warn); }
.goal-top { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; }
.goal-n { width: 30px; height: 30px; border-radius: 8px; background: var(--blue-soft); color: var(--blue); font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; font-size: .85rem; }
.goal-title { font-weight: 650; font-size: .96rem; }
.goal-meta { display: grid; grid-template-columns: minmax(0, 2fr) repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0 16px 14px 60px; font-size: .84rem; }
.goal-meta .k { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 650; margin-bottom: 2px; }
.goal-form { padding: 4px 16px 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px 16px; border-top: 1px solid var(--line); padding-top: 14px; }
.goal-form .full { grid-column: 1 / -1; }
.weight-badge { font-family: var(--f-display); font-weight: 700; font-size: .95rem; color: var(--blue); background: var(--blue-soft); border-radius: 7px; padding: 3px 9px; white-space: nowrap; }
.add-row { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border: 1px dashed var(--line2); border-radius: var(--r); background: transparent; color: var(--blue); font-weight: 650; }
.add-row:hover { background: var(--blue-soft); border-color: var(--blue-line); }
.comp-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 18px; align-items: start; }
.lib-item { border: 1px solid var(--line); border-radius: var(--r-sm); background: #fff; padding: 11px 13px; display: flex; flex-direction: column; gap: 8px; }
.lib-item.sel { border-color: var(--blue-line); background: #FAFCFF; }
.lib-item.slot { background: var(--surface2); border-style: dashed; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; background: #fff; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; font-size: .82rem; font-weight: 600; color: var(--text2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--surface2); }
.seg button.on { background: var(--blue); color: #fff; }
.seg.err { border-color: var(--risk); }
.levels { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.levels.stacked { grid-template-columns: minmax(0,1fr); }
.level { border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; font-size: .8rem; background: #fff; }
.level.on { border-color: var(--blue); background: var(--blue-soft); }
.level h4 { font-size: .8rem; margin-bottom: 4px; }
.checklist { display: flex; flex-direction: column; gap: 6px; }
.ck { display: flex; gap: 8px; align-items: flex-start; font-size: .86rem; }
.ck svg { margin-top: 2px; }
.ck.ok svg { color: var(--good); } .ck.no svg { color: var(--risk); } .ck.info svg { color: var(--muted); } .ck.note svg { color: var(--warn); }

/* ---------- tables ---------- */
.table-wrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: #fff; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .84rem; min-width: 920px; }
.tbl th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; padding: 10px 12px; background: var(--surface2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr:hover td { background: #FAFBFD; }
.empty { padding: 34px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty svg { width: 34px; height: 34px; color: #A9B4C8; }

/* ---------- inbox & chat ---------- */

   The server assesses; the browser stores results, applies facilitator
   overrides and adds up the totals. Learning Score ≠ Employee Pulse.

const AIS = { loaded: false, provider: "unknown", model: null, scoring: null, openings: null, error: null };
async function loadStatus() {
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    const j = await r.json();
    if (!j.ok) throw new Error(j.message || "status");
    Object.assign(AIS, { loaded: true, provider: j.provider, model: j.model, scoring: j.scoring, openings: j.openings, error: null });
  } catch (e) {
    Object.assign(AIS, { loaded: true, provider: "offline", error: "The SCORE server could not be reached. Conversations and assessments need the server (see README)." });
  }
}
class ApiError extends Error { constructor(code, message) { super(message); this.code = code; } }
async function api(path, body) {
  let r;
  try { r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); }
  catch (e) { throw new ApiError("network", "The SCORE server could not be reached. Check the connection and try again."); }
  let j = null; try { j = await r.json(); } catch (e) { /* not JSON */ }
  if (!j || !j.ok) throw new ApiError((j && j.error) || "http_" + r.status, (j && j.message) || `The server returned an error (${r.status}).`);
  return j;
}
const aiReady = () => AIS.provider === "live" || AIS.provider === "mock";
function aiNotice() {
  if (!AIS.loaded) return "";
  if (AIS.provider === "mock") return `<div class="notice warn ai-banner">${icon("alert", "i-sm")}<span><b>Test mode:</b> scripted test responses, not live AI. Use only for automated testing.</span></div>`;
  if (AIS.provider === "unavailable") return `<div class="notice risk ai-banner">${icon("alert", "i-sm")}<span><b>Live AI conversations are unavailable:</b> no AI provider is configured on the server. Please let your facilitator know.</span></div>`;
  if (AIS.provider === "offline") return `<div class="notice risk ai-banner">${icon("alert", "i-sm")}<span>${esc(AIS.error)}</span></div>`;
  return "";
}

/* ---------- Score aggregation ---------- */
function assessments(r = rec()) { return [r.plan.assessment, r.align.assessment, r.r2.assessment, r.r3.final.assessment].filter(Boolean); }
function criterionResults(r = rec()) {
  const got = new Map(); assessments(r).forEach(a => (a.criteria || []).forEach(c => got.set(c.id, c)));
  if (!AIS.scoring) return [];
  return AIS.scoring.flatMap(g => g.criteria.map(c => {
    const a = got.get(c.id), fac = r.fac[c.id];
    const base = a ? a.score : null, score = fac != null ? fac : base;
    return { ...c, group: g.id, round: g.round, groupLabel: g.label, a, score, src: fac != null ? "facilitator" : a ? "ai" : "pending" };
  }));
}
function scoreSummary(r = rec()) {
  const crit = criterionResults(r);
  const groups = (AIS.scoring || []).map(g => { const cs = crit.filter(c => c.group === g.id); return { ...g, score: cs.reduce((s, c) => s + (c.score || 0), 0), pending: cs.filter(c => c.score == null).length, crit: cs }; });
  const rounds = [1, 2, 3].map(n => { const gs = groups.filter(g => g.round === n); return { n, max: gs.reduce((s, g) => s + g.max, 0), score: gs.reduce((s, g) => s + g.score, 0), pending: gs.reduce((s, g) => s + g.pending, 0), groups: gs }; });
  return { groups, rounds, total: rounds.reduce((s, x) => s + x.score, 0), max: rounds.reduce((s, x) => s + x.max, 0), pending: rounds.reduce((s, x) => s + x.pending, 0) };
}

  if (!r.r3.done) return pageHead("Feedback report", "Feedback report") + lockedPanel("Not available yet", "Your feedback report is available once the year-end appraisal is complete.");
  if (!AIS.scoring) return pageHead("Feedback report", "Feedback report", empChip()) + lockedPanel("Scoring unavailable", "The SCORE server could not be reached.");
  const sum = scoreSummary(r), tab = UI.sub || "summary";
  const tabs = [["summary", "Overview"], ...[1, 2, 3].map(n => [String(n), STAGE_TAB[n]])];
  return pageHead("Feedback report", "SCORE feedback report", empChip(), "Your Learning Score is criterion-based and separate from Omar's Employee Pulse.") + `
    <div class="tabs" style="margin-bottom:16px">${tabs.map(([id, l]) => { const rr = sum.rounds.find(x => String(x.n) === id); return `<button class="tab ${tab === id ? "on" : ""}" data-act="go" data-go="review/${id}">${l}${rr && roundAvailable(rr.n, r) ? `<span class="n">${rr.score}/${rr.max}</span>` : ""}</button>`; }).join("")}</div>
    ${tab === "summary" ? reviewSummary(r, sum) : roundAvailable(+tab, r) ? reviewRound(r, sum, +tab) : lockedPanel("Not completed yet", "Results appear when this stage is submitted.")}`;
};
function reviewSummary(r, sum) {
  return `<div class="stack-lg">
    <div class="card pad-lg stack"><div class="row between"><div><div class="eyebrow">SCORE Learning Score</div><h2 style="margin-top:4px">How well you applied performance management</h2></div><span class="score-big num">${sum.total}<span class="small muted"> / ${sum.max}</span></span></div>
      ${sum.rounds.map(x => `<div class="stack-sm"><div class="row between small"><b>${ROUND_TITLE[x.n]}</b><b class="num">${roundAvailable(x.n, r) ? `${x.score}/${x.max}` : "Not completed"}</b></div><div class="bar"><i style="width:${x.max ? x.score / x.max * 100 : 0}%"></i></div></div>`).join("")}
      ${sum.pending && r.r3.done ? `<p class="xs" style="color:var(--warn)">${sum.pending} criteria were not assessed and count as 0. Your facilitator can enter them.</p>` : ""}
      <p class="xs muted">Criteria are assessed against a rubric from what you wrote and said. Facilitator-entered scores replace the AI assessment for that criterion.</p>
    </div>
    <div class="card"><div class="card-h"><h3>Employee Pulse ${r.r3.done ? "outcome" : "so far"}</h3><span class="xs muted">Omar Hassan</span></div><div class="card-b stack">${pulseBars(r)}${pulseHistory(r)}</div></div>
    <div class="card"><div class="card-h"><h3>SCORE Practice Check</h3><span class="xs muted">Not scored · take it back to work</span></div><div class="card-b stack" style="gap:8px">
      ${PRACTICE.map((q, i) => `<div class="row between nowrap" style="border-bottom:1px solid var(--line);padding-bottom:8px"><span class="small">${esc(q)}</span><div class="seg">${["Yes", "Partly", "No"].map(o => `<button class="${r.pc[i] === o ? "on" : ""}" data-act="pc" data-i="${i}" data-v="${o}">${o}</button>`).join("")}</div></div>`).join("")}
    </div></div>
  </div>`;
}
function retryFor(n, r) {
  const err = n === 1 ? (r.plan.error || r.align.error) : n === 2 ? r.r2.error : r.r3.final.error;
  if (!err) return "";
  return `<div class="notice risk">${icon("alert", "i-sm")}<span class="grow">${esc(err)}</span>${aiReady() ? `<button class="btn sm" data-act="assessRetry" data-k="${n === 1 ? "round1" : n === 2 ? "round2" : "round3"}">Retry assessment</button>` : ""}</div>`;
}
function reviewRound(r, sum, n) {
  const rr = sum.rounds.find(x => x.n === n);
  const fb = n === 1 ? r.plan.assessment && r.plan.assessment.feedback : n === 2 ? r.r2.assessment && r.r2.assessment.feedback : r.r3.final.assessment && r.r3.final.assessment.feedback;
  return `<div class="stack-lg">
    <div class="card pad row between"><div><div class="eyebrow">${STAGE_TAB[n]}</div><h3 style="margin-top:4px">${ROUND_TITLE[n]}</h3></div><span class="score-big num">${rr.score}<span class="small muted">/${rr.max}</span></span></div>
    ${retryFor(n, r)}
    ${n === 1 && fb ? planFeedback(r, fb) : ""}
    ${n !== 1 && fb && fb.summary ? `<div class="card pad stack-sm"><h4>Summary</h4><p class="small t2">${esc(fb.summary)}</p>${fb.overlooked ? `<p class="small t2"><b>Overlooked:</b> ${esc(fb.overlooked)}</p>` : ""}</div>` : ""}
    ${n === 3 ? sbiiDebrief(r) : ""}
    ${rr.groups.map(g => `<div class="card"><div class="card-h"><h3>${esc(g.label)}</h3><b class="num">${g.score}/${g.max}</b></div><div class="card-b stack">${g.crit.map(critRow).join("")}</div></div>`).join("")}
  </div>`;
}
/* Appraisal discussion debrief: shown only in the report after the year is complete, never in the chat */
function sbiiDebrief(r) {
  const s = r.r3.sbii.result; if (!s) return "";
  return `<div class="card"><div class="card-h"><h3>Your appraisal discussion with Omar</h3><b class="num">${s.total}/${s.max}</b></div><div class="card-b stack">
    <p class="xs muted">${r.r3.conv.outcome === "incomplete" ? "The discussion was closed before next steps were agreed." : "The discussion reached an agreement."} This 12-point check is converted to ${s.points} of the 4 conversation points in the year-end score.</p>
    ${s.criteria.map(c => `<div class="crit-row"><div class="row between nowrap"><b class="small">${esc(c.label)}</b><b class="num small">${c.score}/2</b></div><p class="small t2">${esc(c.reason)}</p>${c.evidence.length ? `<div class="quotes">${c.evidence.map(q => `<q>${esc(q)}</q>`).join("")}</div>` : ""}</div>`).join("")}
    ${s.feedback.strengths ? `<p class="small t2"><b>What worked:</b> ${esc(s.feedback.strengths)}</p>` : ""}${s.feedback.improve ? `<p class="small t2"><b>To improve:</b> ${esc(s.feedback.improve)}</p>` : ""}
  </div></div>`;
}
function critRow(c) {
  const a = c.a;
  return `<div class="crit-row"><div class="row between nowrap"><b class="small">${esc(c.label)}</b><span class="row nowrap" style="gap:6px"><span class="src src-${c.src === "ai" ? "self" : c.src}">${c.src === "ai" ? "AI-assessed" : c.src === "facilitator" ? "Facilitator" : "Not assessed"}</span><b class="num">${c.score != null ? c.score : "–"}/${c.max}</b></span></div>
    ${a ? `<p class="small t2">${esc(a.reason)}</p>${a.evidence.length ? `<div class="quotes">${a.evidence.map(q => `<q>${esc(q)}</q>`).join("")}</div>` : ""}<div class="xs muted">Confidence: ${esc(a.confidence)}${a.missing ? ` · Missing: ${esc(a.missing)}` : ""}</div>` : ""}</div>`;
}
function planFeedback(r, fb) {
  const V = { strong: ["st-approved", "Strong"], adequate: ["st-in_progress", "Adequate"], needs_improvement: ["st-draft", "Needs improvement"] };
  return `<div class="card"><div class="card-h"><h3>Feedback on your plan</h3></div><div class="card-b stack">
    ${(fb.objectives || []).map(o => { const ob = r.goals.objectives[o.index - 1]; const v = V[o.verdict] || V.adequate; return ob ? `<div class="crit-row"><div class="row between nowrap"><b class="small">Objective ${o.index}: ${esc(ob.objective)}</b><span class="chip ${v[0]}">${v[1]}</span></div><div class="xs muted">Measurement: ${esc(ob.measure || "")}</div><p class="small t2">${esc(o.comment)}</p></div>` : ""; }).join("")}
    ${(fb.competencies || []).length ? `<div class="stack-sm"><h4>Competencies</h4>${fb.competencies.map(c => `<p class="small t2"><b>${esc(c.name)}:</b> ${esc(c.comment)}</p>`).join("")}</div>` : ""}
    ${fb.overall ? `<p class="small t2">${esc(fb.overall)}</p>` : ""}
  </div></div>`;
}

/* =========================================================
   EVENTS & WORKFLOW ACTIONS
   ========================================================= */
let _undo = null;
function afterBind(path) {
  const r = rec();
  if (path.includes(".goals.") && r.goals.status === "not_started") r.goals.status = "draft";
  if (path.includes(".r3.appraisal.") && r.r3.appraisal.status === "not_started") r.r3.appraisal.status = "draft";
}
const wire = (log) => log.filter(m => m.from === "manager" || m.from === "employee").map(m => ({ from: m.from, text: m.text }));
function convContext(kind, r = rec()) {
  const ctx = { plan: planPayload(r), pulse: { ...r.pulse.values } };
  if (kind !== "alignment") ctx.prior = priorPayload(r);
  if (kind === "appraisal") { ctx.appraisal = appraisalPayload(r); ctx.pathway = r.r2.pathway; ctx.priorLogs = priorLogs(r); ctx.evidence = evidencePayload(r); }
  return ctx;
}
const priorLogs = (r = rec()) => ({ alignment: wire(r.align.log), diagnostic: wire(r.r2.diag.log) });
const convLog = (kind, r = rec()) => kind === "alignment" ? r.align.log : kind === "diagnostic" ? r.r2.diag.log : r.r3.conv.log;
function applyEvents(r, events, reason) { (events || []).forEach(e => applyPulse(r, e, reason)); }
const clsReason = (a, fallback) => (a && a.feedback && a.feedback.summary) ? a.feedback.summary.slice(0, 220) : fallback;

/* ---------- assessments (server) ---------- */
async function assessRound1() {
  const r = rec(); r.plan.error = null; r.align.error = null;
  const [p, a] = await Promise.allSettled([
    api("/api/assess", { task: "plan", payload: { plan: planPayload(r) } }),
    r.align.manual ? Promise.resolve(null) : api("/api/assess", { task: "alignment", payload: { plan: planPayload(r), history: wire(r.align.log) } })
  ]);
  if (p.status === "fulfilled") r.plan.assessment = p.value; else r.plan.error = `Plan assessment unavailable: ${p.reason.message}`;
  if (a.status === "fulfilled" && a.value) {
    r.align.assessment = a.value;
    const beh = (a.value.classification || {}).behaviour;
    if (a.value.events.length) applyEvents(r, a.value.events, `Alignment conversation assessed as ${beh}.`);
    else pulseNote(r, "alignment", "Alignment: mixed approach", "Concern addressed only partly or inconsistently: no Pulse change.", 1);
  } else if (a.status === "rejected") r.align.error = `Alignment assessment failed: ${a.reason.message}`;
  save(); render();
}
async function assessRound2() {
  const r = rec(); UI.busy = "round2"; r.r2.error = null; render();
  try {
    const res = await api("/api/assess", { task: "round2", payload: { plan: planPayload(r), history: wire(r.r2.diag.log), evidence: evidencePayload(r), interpretation: r.r2.interpretation } });
    r.r2.assessment = res;
    if (!r.r2.manual) r.r2.pathway = res.pathway;
    if (res.events.length) applyEvents(r, res.events, clsReason(res, "Mid-year conversation assessed."));
    else pulseNote(r, "coaching", "Mid-year conversation: no clear pattern", "Neither clearly constructive nor punitive: no Pulse change.", 2);
  } catch (e) { r.r2.error = `The mid-year review could not be processed: ${e.message}`; }
  UI.busy = null; save(); render();
}
async function assessRound3() {
  const r = rec(); UI.busy = "round3"; r.r3.final.error = null; render();
  try {
    const b = r.r3.bias.result;
    if (!r.r3.sbii.result) await runSbii();
    const sb = r.r3.sbii.result;
    const res = await api("/api/assess", { task: "round3", payload: { sbii: sb ? sb.scores : null, appraisal: appraisalPayload(r), history: wire(r.r3.conv.log), pathway: r.r2.pathway, reflection: r.r3.bias.reflection, bias: b ? [b.summary, ...b.flags.map(f => `${f.bias}: ${f.explanation}`)].join("\n") : "" } });
    r.r3.final.assessment = res;
    if (res.events.length) applyEvents(r, res.events, clsReason(res, "Final appraisal assessed."));
    else pulseNote(r, "appraisal", "Final appraisal: mixed", "Appraisal partly evidence-based: no Pulse change.", 3);
    r.r3.done = true;
    UI.busy = null; save(); toast("Appraisal finalized."); go("inbox", "closed"); return;
  } catch (e) { r.r3.final.error = `The appraisal could not be finalized: ${e.message}`; }
  UI.busy = null; save(); render();
}
/* Behind-the-scenes assessment of the appraisal discussion (never shown in the chat) */
async function runSbii() {
  const r = rec(); r.r3.sbii.error = null;
  try {
    const res = await api("/api/assess", { task: "sbii", payload: { appraisal: appraisalPayload(r), history: wire(r.r3.conv.log), pathway: r.r2.pathway, priorLogs: priorLogs(r), completed: !!r.r3.conv.completed } });
    r.r3.sbii.result = res;
    if (res.events.length) applyEvents(r, res.events, r.r3.conv.completed ? "Appraisal discussion completed." : "Appraisal discussion closed before an agreement was reached.");
    else pulseNote(r, "feedback", "Appraisal discussion: no clear pattern", "Neither clearly fair and listening nor blaming: no Pulse change.", 3);
  } catch (e) { r.r3.sbii.error = `The appraisal discussion could not be assessed: ${e.message}`; }
  save(); render();
}
async function runBias() {
  const r = rec(); UI.busy = "bias"; r.r3.bias.error = null; render();
  try { r.r3.bias.result = await api("/api/assess", { task: "bias", payload: { appraisal: appraisalPayload(r), history: wire(r.r3.conv.log), pathway: r.r2.pathway } }); }
  catch (e) { r.r3.bias.error = `Bias check failed: ${e.message}`; }
  UI.busy = null; save(); render();
}
/* Adds Omar's scripted opening to a context once (idempotent: safe on refresh and repeat events) */
function ensureChatOpenings(r = rec()) {
  if (!AIS.openings) return false;
  let changed = false;
  if (r.goals.status === "pending_alignment" && !r.align.log.some(m => m.from === "employee")) { r.align.log.push({ from: "employee", text: AIS.openings.alignment }); changed = true; }
  if (r2Status(r) !== "locked" && !r.r2.diag.log.some(m => m.from === "employee")) { r.r2.diag.log.push({ from: "employee", text: AIS.openings.diagnostic }); changed = true; }
  if (r.r3.appraisal.status === "submitted" && !r.r3.appraisal.revisions && AIS.openings.appraisal && !r.r3.conv.log.some(m => m.from === "employee")) { r.r3.conv.log.push({ from: "employee", text: AIS.openings.appraisal }); changed = true; }
  return changed;
}
function releaseRound(k) {
  if (S.released[k]) return;
  S.released[k] = true; UI.period = null;
  const r = rec();
  if (k === "r2") applyPulse(r, "midyear_disruption", "Valtora's lower-priced Customer360 alternative put the Commercial Department under pressure.");
  ensureChatOpenings(r);
  save();
  if (k === "r3") loadYearEnd();
}
async function loadYearEnd() {
  const r = rec();
  if (r.r3.dataset && r.r3.dataset.version === EVIDENCE_VERSION) return;   /* older saves hold an earlier record: reload the current one */
  if (UI.busy === "yearend") return;
  UI.busy = "yearend"; r.r3.error = null;
  try {
    const res = await api("/api/yearend", {});
    r.r3.dataset = res.dataset; r.r3.tag = res.tag; UI.period = null;   /* show the newest period when results arrive */
    /* A December Development increase needs DOCUMENTED follow-through in the record, never mid-year coaching quality alone */
    const ft = (res.dataset.registers.development || []).filter(x => x.followThrough);
    if (ft.length) applyPulse(r, "documented_followthrough", `Documented development follow-through: ${ft.map(x => x.record).join("; ")}.`);
    else pulseNote(r, "intervention", "No documented development follow-through", "The year-end record shows no coaching or development activity after July: no Pulse change.", 3);
  } catch (e) { r.r3.error = `The year-end update could not be loaded: ${e.message}`; }
  UI.busy = null; save(); render();
}
function afterRoute() {
  const r = rec();
  if (S.session && UI.signedIn && ["yearend", "inbox", "appraisal"].includes(UI.route) && r3Status(r) !== "locked" && !(r.r3.dataset && r.r3.dataset.version === EVIDENCE_VERSION) && !r.r3.error) loadYearEnd();
}

/* ---------- conversation ---------- */
async function sendChat(kind, text) {
  const r = rec(), log = convLog(kind, r);
  if (UI.busy) return;
  if (text) log.push({ from: "manager", text });
  UI.busy = kind; UI.chatErr = null; save(); render();
  try {
    const res = await api("/api/converse", { kind, history: wire(log), context: convContext(kind, r) });
    log.push({ from: "employee", text: res.reply });
    if (kind === "alignment") r.align.ready = !!res.ready;
    if (kind === "appraisal" && res.complete && !r.r3.conv.completed) { r.r3.conv.completed = true; log.push({ from: "sys", text: "Appraisal Discussion Completed" }); }
  } catch (e) {
    if (text) { log.pop(); setPath(S, P("drafts", kind), text); }
    UI.chatErr = { kind, message: text ? `Your message was not sent: ${e.message}` : `Omar's message could not be loaded: ${e.message}`, retry: !text };
    if (!UI.chatOpen && !text) toast("A chat message could not be loaded. Open the chat to retry.");
  }
  UI.busy = null; save(); render();
}

const ACTIONS = {
  /* --- session --- */
  signin() {
    const name = document.getElementById("login-name").value.trim();
    if (!name) { UI.loginErr = "Enter your username."; render(); const f = document.getElementById("login-name"); if (f) f.focus(); return; }
    UI.loginErr = null;
    if (S.session) { UI.modal = { type: "newSession", name }; return render(); }
    ACTIONS._start(name);
  },
  signinConfirm() { const m = UI.modal; UI.modal = null; ACTIONS._start(m.name); },
  _start(name) { const p = document.getElementById("login-pass"); if (p) p.value = ""; startSession(name); setSignedIn(true); go("inbox", "start"); },
  resume() { setSignedIn(true); go("home"); },
  signout() { save(true); setSignedIn(false); UI.dd = null; location.hash = ""; render(); },
  doReset() { const n = S.session ? S.session.name : ""; startSession(n); UI.modal = null; toast("Session reset."); go("home"); },

  dd(el) { UI.dd = UI.dd === el.dataset.dd ? null : el.dataset.dd; render(); },
  modal(el) { UI.modal = { type: el.dataset.m, emp: el.dataset.emp, k: el.dataset.k }; UI.dd = null; UI.side = false; render(); },
  closeModal() { UI.modal = null; render(); },
  closeModalBg(el, ev) { if (ev.target === el) { UI.modal = null; render(); } },

  compOpen(el) { const cur = UI.compOpen === undefined ? (rec().goals.comps[0] || {}).id : UI.compOpen; UI.compOpen = cur === el.dataset.id ? null : el.dataset.id; render(); },
  pmToggle() { UI.pmOpen = !(UI.pmOpen !== false || PM_ROUTES.includes(UI.route)); if (!UI.pmOpen && PM_ROUTES.includes(UI.route)) UI.pmOpen = true; render(); },
  kpi(el) { UI.kpiOpen = UI.kpiOpen === el.dataset.id ? null : el.dataset.id; render(); },
  period(el) { if (!periodAvailable(el.dataset.v)) return; UI.period = el.dataset.v; UI.month = null; UI.kpiOpen = null; render(); },
  focus(el) { UI.focus = el.dataset.v; render(); },
  series(el) { UI.series = UI.series || { win: true, obj: true }; const k = el.dataset.k, other = k === "win" ? "obj" : "win"; if (UI.series[k] && !UI.series[other]) return; UI.series[k] = !UI.series[k]; render(); },
  kpiAlert() { UI.alertOpen = !UI.alertOpen; render(); },
  month(el) { const i = +el.dataset.i; UI.month = UI.month === i ? null : i; render(); },
  dashView(el) { UI.dashView = el.dataset.v; render(); },

  /* --- goal plan --- */
  addObj() { const r = rec(), o = blankObjective(); r.goals.objectives.push(o); if (r.goals.status === "not_started") r.goals.status = "draft"; UI.edit = o.id; UI.flash = "obj-" + o.id; save(); render(); const f = document.querySelector(`#obj-${o.id} textarea`); if (f) f.focus(); },
  editObj(el) { UI.edit = el.dataset.id; UI.flash = "obj-" + el.dataset.id; render(); },

  delObj(el) {

    const [o] = r.goals.objectives.splice(i, 1); _undo = () => rec().goals.objectives.splice(i, 0, o);
    if (UI.edit === o.id) UI.edit = null; save(); toast(`Objective ${i + 1} removed.`, true); render();
  },
  compAdd(el) { const r = rec(); if (r.goals.comps.length >= COMP_RANGE.max || r.goals.comps.some(c => c.id === el.dataset.id)) return; r.goals.comps.push({ id: el.dataset.id, level: "", standard: "" }); if (r.goals.status === "not_started") r.goals.status = "draft"; save(); render(); },
  compDel(el) { const r = rec(), i = r.goals.comps.findIndex(c => c.id === el.dataset.id); if (i < 0) return; const [c] = r.goals.comps.splice(i, 1); _undo = () => rec().goals.comps.splice(i, 0, c); save(); toast(`${compName(c.id)} removed.`, true); render(); },
  compLevel(el) { rec().goals.comps[+el.dataset.i].level = el.dataset.v; save(); render(); },
  submitGoals() {

    r.goals.objectives.forEach(o => { o.agreed = deriveDefinition(o); });   /* agreed target / calculation definition used at year-end */
    r.goals.status = "pending_alignment"; r.goals.submits++; r.goals.tried = false; UI.edit = null; r.align.ready = false;
    r.align.log.push({ from: "sys", text: r.goals.submits === 1 ? `Performance plan shared with Omar · ${SIM_DATES.submitted}` : "Revised performance plan shared with Omar" });

    UI.chatOpen = false; save(); toast("Performance contract confirmed."); go("inbox", "approved");

  },

  /* --- email notifications --- */
  openMailPop(el) { const id = el.dataset.id; clearTimeout(UI.mailHide); UI.mailPop = null; markRead(id); go("inbox", id); pumpMailQueue(); },
  closeMailPop() { dismissMailPop(); },

  /* --- chat --- */
  openChat() { UI.chatOpen = true; UI.dd = null; UI.side = false; markChatSeen(); render(); const t = document.querySelector(".chat-win textarea"); if (t) t.focus({ preventScroll: true }); },
  closeChat() { UI.chatOpen = false; render(); },
  chatSend() {
    const r = rec(), kind = activeChatContext(r), path = P("drafts", "chat"), text = String(val(path)).trim();
    if (!kind || !text || UI.busy) return;
    if (text.length > CHAT_LIMITS.message) { UI.chatErr = { kind, message: `Please keep messages under ${CHAT_LIMITS.message} characters.` }; return render(); }
    setPath(S, path, ""); sendChat(kind, text);
  },
  chatRetry(el) { sendChat(el.dataset.k, null); },
  endCancel() { UI.endConfirm = false; render(); },
  sbiiRetry() { runSbii(); },
  appraisalContinue() {
    const r = rec(); if (r.r3.conv.ended || managerCount(r.r3.conv.log) < CHAT_LIMITS.appraisalMin) return;
    if (!r.r3.conv.completed && !UI.endConfirm) { UI.endConfirm = true; return render(); }   /* second click confirms ending early */
    UI.endConfirm = false;
    r.r3.conv.ended = true; r.r3.conv.outcome = r.r3.conv.completed ? "completed" : "incomplete";
    r.r3.conv.log.push({ from: "sys", text: r.r3.conv.completed ? "Conversation closed" : "Conversation closed before an agreement was reached" });
    UI.chatOpen = false; UI.apPart = "III"; save(); go("appraisal"); toast("Discussion closed. Complete Part III, then review and finalize."); if (aiReady()) { runSbii(); runBias(); }
  },

  /* --- evidence --- */
  evNew() { UI.modal = { type: "evidence", d: evDraft(null) }; if (UI.evFilter !== "all") UI.modal.d.link = UI.evFilter; render(); const f = document.getElementById("ev-period"); if (f) f.focus(); },
  evEdit(el) { UI.modal = { type: "evidence", d: evDraft(rec().evidence.find(e => e.id === el.dataset.id)) }; render(); },
  evSave() {
    const d = UI.modal.d; if (evMissing(d).length) { UI.modal.tried = true; return render(); }
    const r = rec(); if (d.source !== "Other") d.sourceOther = "";
    if (d.id) { r.evidence[r.evidence.findIndex(e => e.id === d.id)] = d; toast("Evidence entry updated."); } else { d.id = uid("e"); r.evidence.push(d); toast("Evidence entry added."); }
    UI.modal = null; save(); render();
  },
  evDel(el) { const r = rec(), i = r.evidence.findIndex(e => e.id === el.dataset.id); if (i < 0) return; const [e] = r.evidence.splice(i, 1); _undo = () => rec().evidence.splice(i, 0, e); save(); toast("Evidence entry deleted.", true); render(); },
  evRef(el) { const sec = evSectionOf(el.dataset.ref); UI.drawer = { type: "evidence", id: "all", sec }; render(); setTimeout(() => { const n = document.getElementById("ev-" + sec); if (n) n.scrollIntoView({ block: "start" }); }, 30); },
  evDrawer(el) { UI.drawer = { type: "evidence", id: el.dataset.id }; render(); },

  /* --- rounds --- */
  releaseCode(el) {
    const k = el.dataset.k, v = ((document.getElementById("code-" + k) || {}).value || "").trim();
    if (k === pendingRelease() && v === RELEASE_CODES[k]) { UI.codeErr = null; releaseRound(k); toast(k === "r2" ? "Mid-year business update received." : "Year-end update received."); k === "r2" ? go("home") : go("inbox", "yearend"); }
    else { UI.codeErr = k; render(); }
  },
  submitR2() { const r = rec(); if (r.r2.submitted || UI.busy) return; r.r2.submitted = true; if (!r.r2.diag.ended) { r.r2.diag.ended = true; r.r2.diag.log.push({ from: "sys", text: "Conversation closed" }); } save(); assessRound2(); },
  loadYearEnd() { rec().r3.error = null; loadYearEnd(); },
  rate(el) { setPath(S, el.dataset.path, +el.dataset.v); afterBind(el.dataset.path); save(); render(); },
  submitAppraisal() {
    const r = rec(), v = appraisalValidation(r), a = r.r3.appraisal;
    a.tried = true; if (a.status === "not_started") a.status = "draft";
    if (!v.shareOK) { const n = v.I.length + v.II.length; UI.apPart = v.I.length ? "I" : "II"; save(); render(); toast(n ? `${plural(n, "item needs", "items need")} attention in Parts I–II before sharing.` : "The overall score could not be calculated yet."); return; }
    a.status = "submitted"; a.tried = false;
    if (a.revisions) { r.r3.conv.log.push({ from: "sys", text: "Revised appraisal recorded" }); r.r3.bias.result = null; save(); go("reflection"); if (aiReady()) runBias(); return; }
    r.r3.conv.log.push({ from: "sys", text: `Appraisal Parts I–II shared with Omar · ${SIM_DATES.yearend}` });
    ensureChatOpenings(r);   /* Omar's neutral opening: once, in the same thread; the chat is not opened automatically */
    save(); toast("Parts I–II shared with Omar."); render();
  },
  apGoto(el) { UI.apPart = el.dataset.v; go("appraisal"); },
  saveDraft() { save(true); toast("Draft saved."); },
  apPart(el) { UI.apPart = el.dataset.v; UI.endConfirm = false; render(); const f = document.getElementById("appraisal-form"); if (f) f.scrollIntoView({ block: "start" }); },
  pdpAdd(el) { const p = rec().r3.appraisal.pdp, k = el.dataset.k; (p[k] = p[k] || []).push(k === "ld" ? { area: "", action: "" } : { course: "", source: "", date: "" }); save(); render(); },
  pdpDel(el) { const p = rec().r3.appraisal.pdp, k = el.dataset.k, i = +el.dataset.i; if (!p[k]) return; const [row] = p[k].splice(i, 1); _undo = () => rec().r3.appraisal.pdp[k].splice(i, 0, row); save(); toast("Row removed.", true); render(); },
  reconsider() { const r = rec(); if (r.r3.done) return; r.r3.appraisal.status = "draft"; r.r3.appraisal.revisions++; save(); go("appraisal"); },
  runBias() { runBias(); },
  finalize() {
    const r = rec(); if (r.r3.done || UI.busy) return;
    const v = appraisalValidation(r);
    if (!v.ok) { UI.apPart = v.I.length ? "I" : v.II.length ? "II" : "III"; toast(`${plural(v.errors.length, "item needs", "items need")} attention before finalizing.`); return go("appraisal"); }
    if (r.r3.bias.reflection.trim().length < 15) { r.r3.bias.tried = true; toast("Write a short reflection before finalizing."); return render(); }
    if (!aiReady()) { toast("AI assessment is unavailable. Please let your facilitator know."); return; }
    assessRound3();
  },
  assessRetry(el) { const k = el.dataset.k; if (k === "round1") assessRound1(); else if (k === "round2") assessRound2(); else assessRound3(); },

  pc(el) { rec().pc[el.dataset.i] = el.dataset.v; save(); render(); }
};

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el) { if (UI.dd) { UI.dd = null; render(); } return; }
  if (el.disabled) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  if (el.tagName === "BUTTON" && el.type === "submit") ev.preventDefault();
  if (UI.dd && el.dataset.act !== "dd") UI.dd = null;
  fn(el, ev);
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") { if (UI.modal) { UI.modal = null; render(); } else if (UI.drawer) { UI.drawer = null; render(); } else if (UI.dd) { UI.dd = null; render(); } }
  if (ev.key === "Enter" && ev.target.id && ev.target.id.startsWith("code-")) ACTIONS.releaseCode({ dataset: { k: ev.target.id.slice(5) } });
  if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey) && ev.target.dataset && /\.drafts\./.test(ev.target.dataset.bind || "")) { const k = ev.target.dataset.bind.split(".").pop(); ev.preventDefault(); ACTIONS.chatSend({ dataset: { k } }); }
});
function handleBind(el) { const path = el.dataset.bind; let v = el.type === "checkbox" ? el.checked : el.value; if (el.dataset.type === "num") v = v === "" ? "" : Number(v); setPath(S, path, v); afterBind(path); save(); }
let _liveT = null;
function liveUpdate() { clearTimeout(_liveT); _liveT = setTimeout(render, 350); }
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.dataset.bind && el.type === "checkbox") return;   /* handled on change */
  if (el.dataset.bind) { handleBind(el); if (el.tagName !== "SELECT" && !/\.drafts\./.test(el.dataset.bind)) liveUpdate(); return; }
  if (el.dataset.ev && UI.modal && UI.modal.d) UI.modal.d[el.dataset.ev] = el.value;
});
document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset.bind && (el.tagName === "SELECT" || el.type === "checkbox")) { handleBind(el); render(); return; }
  if (el.dataset.ev && UI.modal && UI.modal.d) { UI.modal.d[el.dataset.ev] = el.value; if (el.tagName === "SELECT") render(); return; }
  if (el.dataset.actChange === "evFilter") { UI.evFilter = el.value; render(); return; }
  if (el.dataset.objMode) { const v = el.value, base = el.dataset.objMode; setPath(S, base + ".mode", v === "review" ? "review" : ""); if (v !== "review") setPath(S, base + ".dir", v); afterBind(base); save(); render(); return; }
  if (el.dataset.actChange === "compPick") { if (el.value) ACTIONS.compAdd({ dataset: { id: el.value } }); return; }
  if (el.dataset.fac) { const r = rec(), id = el.dataset.fac, max = +el.max; if (el.value === "") delete r.fac[id]; else r.fac[id] = Math.max(0, Math.min(max, Math.round(+el.value))); save(); render(); }
});

let _rzT = null;
window.addEventListener("resize", () => { clearTimeout(_rzT); _rzT = setTimeout(() => { if (document.querySelector(".chart")) render(); }, 200); });

/* ---------- boot ---------- */
(async function boot() {
  const h = parseHash(); UI.route = h.route === "login" ? "home" : h.route; UI.sub = h.sub;
  render();
  await loadStatus();
  if (S.session && ensureChatOpenings()) save();
  render(); afterRoute();
})();

</script>
</body>
</html>
